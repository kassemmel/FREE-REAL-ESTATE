# BleepBloopBot — Azure public-edge VM deployment.
#
# Run from the repo root (the VM git-pulls this repo):
#   docker compose -f docker-compose.azure.yml up -d --build
#
# nginx is the public edge and terminates TLS itself (certbot issues/renews the
# Let's Encrypt cert — see azure/nginx.conf). Shared services (ollama, backend)
# come from compose.base.yml. n8n / stocks-mcp are intentionally NOT here; they
# run only on the Caddy host.
#
# `name: azure` is pinned on purpose: the VM's existing named volumes are
# azure_ollama_data / azure_prompts_data (from the old `-f azure/docker-compose.yml`
# invocation). Keeping the project name "azure" preserves the pulled Ollama models
# and saved prompts across this restructure.
name: azure

include:
  - compose.base.yml

services:
  web:
    container_name: bleepbloopbot-web
    image: nginx:alpine
    restart: unless-stopped
    # nginx is the public edge. Port 80 = ACME challenge + redirect, 443 = TLS.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./azure/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared with the certbot service: certs in conf/, ACME webroot in www/.
      - ./azure/certbot/conf:/etc/letsencrypt:ro
      - ./azure/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - internal
    # Reload every 6h so a renewed cert is picked up without a manual restart.
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'

  # Manual / one-shot certbot. Keeps the image's default `certbot` entrypoint so
  # subcommands pass straight through, e.g. first issuance:
  #   docker compose -f docker-compose.azure.yml run --rm certbot certonly --webroot -w /var/www/certbot \
  #     -d demo-networks.com --email kassemmel@protonmail.com --agree-tos --no-eff-email
  # `profiles` keeps it from starting on `up` (an arg-less certbot would just exit);
  # `docker compose run` starts it regardless of the profile.
  certbot:
    container_name: bleepbloopbot-certbot
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - ./azure/certbot/conf:/etc/letsencrypt
      - ./azure/certbot/www:/var/www/certbot

  # Long-running auto-renewal loop (started by `up`). The shell entrypoint is why
  # this one can't also serve the manual `certonly` command above.
  certbot-renew:
    container_name: bleepbloopbot-certbot-renew
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./azure/certbot/conf:/etc/letsencrypt
      - ./azure/certbot/www:/var/www/certbot
    # Try renewal twice a day; certbot no-ops until the cert is ~30 days to expiry.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'
